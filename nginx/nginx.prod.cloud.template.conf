events {}



http {

    log_format balanceo_logs '$remote_addr - [$time_local] "$request" '

                             'status: $status | backend_respondio: $frontend_host';



    access_log /var/log/nginx/access.log balanceo_logs;

    resolver 8.8.8.8 8.8.4.4 valid=300s;

    resolver_timeout 5s;



    # Cloud Run exige Host = URL del servicio destino (no el del LB).

    split_clients "${remote_addr}${remote_port}${request_uri}" $frontend_host {

        33.3% __FRONTEND_1_HOST__;

        33.3% __FRONTEND_2_HOST__;

        *     __FRONTEND_3_HOST__;

    }



    server {

        listen 8080;



        location / {

            proxy_pass https://$frontend_host;

            proxy_ssl_server_name on;

            proxy_ssl_name $frontend_host;

            proxy_set_header Host $frontend_host;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Served-By $frontend_host always;

        }



        location /api/ {

            proxy_pass https://__KRAKEND_HOST__;

            proxy_ssl_server_name on;

            proxy_ssl_name __KRAKEND_HOST__;

            proxy_set_header Host __KRAKEND_HOST__;

            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

        }

    }

}


