events {}

http {
    log_format balanceo_logs '$remote_addr - [$time_local] "$request" '
                             'status: $status | backend_respondio: $upstream_addr';

    access_log /var/log/nginx/access.log balanceo_logs;

    upstream frontend_servers {
        server frontend1:80;
        server frontend2:80;
        server frontend3:80;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://frontend_servers;

            add_header X-Served-By $upstream_addr always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Gateway desplegado (Cloud Run)
        location /api/ {
            proxy_pass https://krakend-api-gateway-54345958397.southamerica-east1.run.app;

            proxy_ssl_server_name on;

            proxy_set_header Host krakend-api-gateway-54345958397.southamerica-east1.run.app;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
